<!DOCTYPE html>
<html lang="en-IN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title }}</title>
<meta name="description" content="{{ page.desc | escape }}">
<link rel="canonical" href="https://gridpe.com/{{ page.slug }}">
<meta name="robots" content="index,follow,max-image-preview:large,max-snippet:-1">
<meta name="theme-color" content="#00C6A2">
<meta name="author" content="GridPe Research Desk">
<meta property="og:type" content="{{ page.ogtype | default: 'website' }}">
<meta property="og:site_name" content="GridPe">
<meta property="og:title" content="{{ page.title | escape }}">
<meta property="og:description" content="{{ page.desc | escape }}">
<meta property="og:url" content="https://gridpe.com/{{ page.slug }}">
<meta property="og:locale" content="en_IN">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ page.title | escape }}">
<meta name="twitter:description" content="{{ page.desc | escape }}">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='5' fill='%2300C6A2'/%3E%3Cpath d='M13 3L5 14h6l-1 7 8-11h-6l1-7z' fill='%2304231D'/%3E%3C/svg%3E">
<link rel="manifest" href="{{ page.p }}site.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap">
<link rel="stylesheet" href="{{ page.p }}assets/css/style.css">
{{ page.head }}
{% if page.schema %}<script type="application/ld+json">{"@context":"https://schema.org","@graph":{{ page.schema | jsonify }}}</script>{% else %}<script type="application/ld+json">{"@context":"https://schema.org","@type":"Organization","name":"GridPe","url":"https://gridpe.com","description":"India's independent electricity, rooftop solar and EV cost calculators.","areaServed":{"@type":"Country","name":"India"}}</script>{% endif %}
</head>
<body{% if page.calc %} data-calc="{{ page.calc }}"{% endif %}>
<div class="topbar">
  <span class="tb-ico" aria-hidden="true">&#9889;</span>
  <span>Contact, if you are interested in this website/domain name&nbsp;&mdash;&nbsp;<a href="https://web.works/contact" target="_blank" rel="noopener">web.works/contact</a></span>
</div>
{% include nav.html %}
<main id="main">
{{ content }}
</main>
{% include footer.html %}
<script src="{{ page.p }}assets/js/site.js"></script>
{% if page.calc %}<script src="{{ page.p }}assets/js/calc.js"></script>{% endif %}
{% if page.pagejs %}<script src="{{ page.p }}assets/js/{{ page.pagejs }}"></script>{% endif %}
</body>
</html>
